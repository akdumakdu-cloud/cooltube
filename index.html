<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanTube TV Client</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Navigation Panel -->
        <div class="sidebar">
            <h2>CleanTube</h2>
            <div class="nav-item focusable active" data-view="trending">Trending</div>
            <div class="nav-item focusable" data-view="search">Search</div>
            <div class="nav-item focusable" data-view="bookmarks">Saved Videos</div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <div id="searchBarContainer" class="search-container hidden">
                <input type="text" id="searchInput" class="focusable-input" placeholder="Type search query...">
                <div id="searchSubmit" class="search-btn focusable-input">Go</div>
            </div>
            
            <div class="video-grid" id="videoGrid">
                <!-- Dynamic Content -->
            </div>
        </div>
    </div>

    <!-- Video Player Modal Overlay -->
    <div id="playerModal" class="player-modal hidden">
        <div class="player-wrapper">
            <iframe id="videoIframe" src="" frameborder="0" allowfullscreen></iframe>
            <div class="close-hint">Press Back or Menu to Close Player</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
